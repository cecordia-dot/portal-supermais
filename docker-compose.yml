services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supermais
      POSTGRES_USER: supermais
      POSTGRES_PASSWORD: troque_esta_senha
    volumes:
      - supermais_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermais -d supermais"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://supermais:troque_esta_senha@db:5432/supermais
      PGSSL: disable
      SESSION_DAYS: 7
      SEED_ADMIN_PASSWORD: troque-esta-senha-admin
      SEED_ASSOCIATE_PASSWORD: troque-esta-senha-associado
    ports:
      - "3000:3000"

volumes:
  supermais_postgres:
